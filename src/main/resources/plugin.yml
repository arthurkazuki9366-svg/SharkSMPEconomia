name: SharkSMPEconomia
version: 1.0.0
main: com.sharksmp.economia.SharkSMPEconomia
api-version: 1.20
description: Plugin de economia, loja, venda de inventario e scoreboard para sharkSMP
commands:
  shop:
    description: Abre a loja do servidor sharkSMP
    aliases: [loja]
  sell:
    description: Vende itens do inventario (/sell ou /sell all)
    aliases: [vender]
  bal:
    description: Mostra seu saldo atual
    aliases: [money, dinheiro, saldo]
